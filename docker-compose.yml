web:
  build: .
  ports:
    - "3000:3000"
  links:
    - mongo
    - rabbitmq
  environment:
    MONGO_URL: mongodb://mongo:27017/renderservice
    RABBIT_MQ_URL: amqp://rabbitmq/
    PUBLIC_RABBIT_MQ_URL: amqp://localhost:5672/
mongo:
  image: mongo:3
rabbitmq:
  image: rabbitmq:3-management
  ports:
    - "15672:15672"
    - "5672:5672"
