web:
  build: .
  ports:
    - "3000:3000"
  links:
    - mongo
    - rabbitmq
  environment:
    MONGO_URL: mongodb://mongo:27017/renderservice
    RABBITMQ_URL: amqp://rabbitmq/renderservice
    RABBITMQ_API_URL: http://guest:guest@rabbitmq:15672/api
    PUBLIC_RABBITMQ_URL: amqp://public:rs3@localhost:5672/renderservice
mongo:
  image: mongo:4
  ports:
    - "27017:27017"
rabbitmq:
  image: rabbitmq:3-management
  ports:
    - "15672:15672"
    - "5672:5672"
