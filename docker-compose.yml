web:
  build: .
  ports:
    - "3000:3000"
  links:
    - mongo
    - rabbitmq
  environment:
    MONGO_URL: mongodb://mongo:27017/renderservice
    RABBIT_MQ_URL: amqp://rabbitmq/rs3
    PUBLIC_RABBIT_MQ_URL: amqp://public:rs3@localhost:5672/rs3
mongo:
  image: mongo:3
rabbitmq:
  image: rabbitmq:3-management
  ports:
    - "15672:15672"
    - "5672:5672"
